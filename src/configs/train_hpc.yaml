# train_multiclass.yaml
data: /path/to/data.yaml
runs_root: /scratch/.../runs/detect
name: multiclass_disc_cup

# resume training
resume: "auto"         # "auto" | "" | "/abs/path/to/last.pt"
epochs: 201            # TOTAL epochs to train to (not additional)

# ------------------ model choice --------------------
# If 'weights' is omitted, it's picked from (family,size).
weights: "/scratch/st-ipor-1/cperez/MedSAM/bounding_box/weights/yolo12x.pt"
family: "auto"      # auto | yolo12 | yolo11 | yolov8
size: "x"           # n | s | m | l | x


imgsz: 640
batch: 16
workers: 8
seed: 1337
device: "auto"      # "auto" → YOLO_DEVICES or CUDA "0", else "cpu"
amp: true
freeze: 10
optimizer: "AdamW"  # AdamW | SGD | RMSProp | Adam
cos_lr: true
patience: 50

# Scheduling helpers
multi_scale: true   # vary input size each epoch
close_mosaic: 10    # disable mosaic in last N epochs

# ------------------ augmentations -------------------
augment:
  # Color jitter
  hsv_h: 0.015
  hsv_s: 0.70
  hsv_v: 0.40

  # Geometric (robustness to ROI crops/zooms)
  degrees: 10.0
  translate: 0.20
  scale: 0.60      # key knob for variable ROI crops
  shear: 2.0
  perspective: 0.001

  # Flips
  flipud: 0.0      # vertical flips usually off for medical
  fliplr: 0.5

  # Sample mixing & occlusion
  mosaic: 0.20
  mixup: 0.10
  copy_paste: 0.00
  erasing: 0.40


