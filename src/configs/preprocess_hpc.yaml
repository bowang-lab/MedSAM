# ---- core ----
project_dir: "/scratch/st-ipor-1/cperez/MedSAM/"

# ---- outputs ----
outputs:
  yolo_root: "/scratch/st-ipor-1/cperez/MedSAM//data/yolo_multiclass"
  runs_root: "/scratch/st-ipor-1/cperez/MedSAM/runs/detect"   # optional; used only if 'train:' is present

# ---- datasets (one or many). 'tag' should match the per-image .dataset field set by your collector. ----
datasets:
  - tag: smdg19
    images_root: "/arc/project/st-ipor-1/carlosp/fundus_data/SMDG-19/full-fundus/full-fundus"
    disc_masks:  "/arc/project/st-ipor-1/carlosp/fundus_data/SMDG-19/optic-disc/optic-disc"
    cup_masks:   "/arc/project/st-ipor-1/carlosp/fundus_data/SMDG-19/optic-cup/optic-cup"
    recursive: false
    exclude_name_contains: ["PAPILA"]

  - tag: rimone
    images_root: "/arc/project/st-ipor-1/carlosp/fundus_data/Organized_Rim-One/fundus"
    disc_masks:  "/arc/project/st-ipor-1/carlosp/fundus_data/Organized_Rim-One/optic-disc"
    cup_masks:   "/arc/project/st-ipor-1/carlosp/fundus_data/Organized_Rim-One/optic-cup"
    recursive: true   # often nested; safest to enable

# (Optional) If you omit 'datasets' entirely, you can provide single-dataset fallbacks:
# images_root: ""
# disc_masks:  ""
# cup_masks:   ""

# ---- split ----
split:
  val_frac: 0.15
  test_frac: 0.10
  seed: 1337
  patient_regex: ""   # set this if you want subject grouping beyond filename heuristics

# ---- saving ----
prefer_copy: false    # true to copy instead of symlink (if your FS dislikes symlinks)

